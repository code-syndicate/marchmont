services:
  mongo:
    image: mongo:8
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    depends_on:
      - mongo
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: marchmont
      SESSION_SECRET: ${SESSION_SECRET}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER}
      MAIL_PROVIDER: ${MAIL_PROVIDER}

volumes:
  mongo-data:
