services:
  mongo:
    image: mongo:8
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    depends_on:
      - mongo
    ports:
      - "10000:10000"
    environment:
      NODE_ENV: production
      PORT: "10000"
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: nashluxuryrealty
      SESSION_SECRET: ${SESSION_SECRET}
      IMAGES_PROVIDER: ${IMAGES_PROVIDER:-unsplash}

volumes:
  mongo-data:
